name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest
      - name: Run tests
        # The NLP-tagger tests need the optional 'nlp' extra plus downloaded
        # nltk data; they skip cleanly without it (see tests/test_nlp.py).
        run: python -m pytest tests -q
      - name: CLI smoke check
        run: |
          stylint --version
          stylint --list-tags >/dev/null
          stylint --workflow final >/dev/null
